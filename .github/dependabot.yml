version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These move together: a bundler and its React plugin, and React with its DOM renderer and typings. Separate pull
    # requests for them cannot resolve their peer dependencies, so each group arrives as one change.
    groups:
      bundler:
        patterns: ["vite", "@vitejs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
