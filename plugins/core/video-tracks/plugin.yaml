api_version: "astral.plugin/v1"
id: "core.video-tracks"
version: "1.0.0"
title: "Object tracks in video"

stage: extract
direction: internal
footprint: none

consumes:
  - type: MediaFile
    required: [artifact]
produces:
  - ObjectTrack

capabilities: [object.track]

config:
  type: object
  properties:
    fps: { type: number, minimum: 0.5, maximum: 10, default: 4 }
    max_frames: { type: integer, minimum: 1, maximum: 3000, default: 600 }
    min_score: { type: number, minimum: 0.1, maximum: 0.9, default: 0.3 }
    prefer: { type: [string, "null"], default: null }

runtimes: [in_process]
entrypoint: "main.py:invoke"
resources: { accelerator: cpu_only, ram_mb: 2048 }
health: { check: "main.py:selfcheck", interval: 24h }

licence:
  code: "AGPL-3.0-or-later"
  data: "none (local computation; the model's licence is in the model registry and recorded per assertion)"
  commercial_use: true
