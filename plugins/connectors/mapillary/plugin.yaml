api_version: "astral.plugin/v1"
id: "connector.mapillary"
version: "1.0.0"
title: "Street-level photo metadata (Mapillary)"

stage: ingest
direction: pull
footprint: third_party

consumes:
  - type: Query
    required: [lat, lon]
produces: [Image]

capabilities: [http.fetch]
secrets: [MAPILLARY_ACCESS_TOKEN]

config:
  type: object
  properties:
    base_url: { type: string, default: "https://graph.mapillary.com" }
    radius_m: { type: integer, minimum: 10, maximum: 450, default: 200, description: "the API requires the box to be under 0.01 degrees square" }
    limit: { type: integer, minimum: 1, maximum: 2000, default: 100 }

runtimes: [in_process]
entrypoint: "main.py:invoke"
# Mapillary: search APIs 10,000 requests per minute per app (checked 2026-11-07).
rate_limit: { requests: 30, per: 1m, scope: credential }
resources: { accelerator: cpu_only, ram_mb: 64 }
health: { check: "main.py:selfcheck", interval: 24h }

licence:
  code: "AGPL-3.0-or-later"
  data: "Mapillary terms of use apply (mapillary.com/terms); imagery is contributor-owned, metadata only is recorded"
  commercial_use: null
origin: "mapillary"
