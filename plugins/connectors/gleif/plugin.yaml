api_version: "astral.plugin/v1"
id: "connector.gleif"
version: "1.0.0"
title: "GLEIF LEI records"

stage: ingest
direction: pull
footprint: third_party

consumes:
  - type: Query
    required: [name]
produces: [Company, Ownership]

capabilities: [http.fetch]

config:
  type: object
  properties:
    base_url: { type: string, default: "https://api.gleif.org/api/v1" }
    max_results: { type: integer, minimum: 1, maximum: 50, default: 10 }
    follow_parent: { type: boolean, default: true }

runtimes: [in_process]
entrypoint: "main.py:invoke"
rate_limit: { requests: 60, per: 1m, scope: host }     # published limit: 60 req/min
resources: { accelerator: cpu_only, ram_mb: 64 }
health: { check: "main.py:selfcheck", interval: 24h }

licence:
  code: "AGPL-3.0-or-later"
  data: "CC0 (GLEIF data)"
  commercial_use: true
origin: "gleif"
