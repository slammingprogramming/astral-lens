api_version: "astral.plugin/v1"
id: "connector.companies-house"
version: "1.0.0"
title: "UK Companies House"

stage: ingest
direction: pull
footprint: third_party

consumes:
  - type: Query
    required: [name]
produces: [Company, Person, Directorship, Ownership]

capabilities: [http.fetch]
secrets: [COMPANIES_HOUSE_API_KEY]

config:
  type: object
  properties:
    base_url: { type: string, default: "https://api.company-information.service.gov.uk" }
    max_companies: { type: integer, minimum: 1, maximum: 20, default: 3 }
    include_officers: { type: boolean, default: true }
    include_psc: { type: boolean, default: true }

runtimes: [in_process]
entrypoint: "main.py:invoke"
rate_limit: { requests: 600, per: 5m, scope: credential }   # published: 600 / 5 min
resources: { accelerator: cpu_only, ram_mb: 64 }
health: { check: "main.py:selfcheck", interval: 24h }

licence:
  code: "AGPL-3.0-or-later"
  data: "UK Open Government Licence v3.0"
  commercial_use: true
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0."
origin: "uk-companies-house"
